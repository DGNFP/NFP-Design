{{ define "main" }}

<link rel="stylesheet" href="{{ "/css/studiopage.css" | relURL }}">

<section class="studio-page-section">
    <div class="container">
        <!-- 헤더 -->
        <div class="studio-page-header">
            <h1>Studio <span>NFP</span></h1>
            <p>스튜디오 NFP<br>디자인 작업을 위한 전문 도구 모음</p>
        </div>

        <!-- 도구 그리드 -->
        <div class="studio-tools-grid">
            <!-- QR 생성기 -->
            <div class="tool-category">
                <h3>QR 생성기</h3>
                <div class="tool-links">
                    <a href="/studio/qr/basic/" class="tool-link">
                        <i class="fas fa-qrcode"></i>
                        <span>기본 QR 생성기</span>
                    </a>
                    <a href="/studio/qr/custom/" class="tool-link">
                        <i class="fas fa-palette"></i>
                        <span>커스텀 QR 생성기</span>
                    </a>
                </div>
            </div>

            <!-- 컬러 도구 -->
            <div class="tool-category">
                <h3>컬러 도구</h3>
                <div class="tool-links">
                    <a href="/studio/color-mixer/" class="tool-link">
                        <i class="fas fa-fill-drip"></i>
                        <span>컬러 조합기</span>
                    </a>
                    <a href="/studio/color-palette/single-card/" class="tool-link">
                        <i class="fas fa-square"></i>
                        <span>단색 카드 뽑기</span>
                    </a>
                    <a href="/studio/color-palette/gradient-card/" class="tool-link">
                        <i class="fas fa-palette"></i>
                        <span>그라데이션 카드</span>
                    </a>
                </div>
            </div>

            <!-- 이미지 도구 -->
            <div class="tool-category">
                <h3>이미지 도구</h3>
                <div class="tool-links">
                    <a href="/studio/image-tools/color-extractor/" class="tool-link">
                        <i class="fas fa-eye-dropper"></i>
                        <span>컬러 추출기</span>
                    </a>
                    <a href="/studio/image-tools/compressor/" class="tool-link">
                        <i class="fas fa-compress-alt"></i>
                        <span>이미지 압축기</span>
                    </a>
                    <a href="/studio/image-tools/resizer/" class="tool-link">
                        <i class="fas fa-expand-arrows-alt"></i>
                        <span>이미지 크기 조절</span>
                    </a>
                </div>
            </div>

            <!-- 계산 도구 -->
            <div class="tool-category">
                <h3>계산 & 변환 도구</h3>
                <div class="tool-links">
                    <a href="/studio/calculator/grid/" class="tool-link">
                        <i class="fas fa-th-large"></i>
                        <span>그리드 계산기</span>
                    </a>
                    <a href="/studio/calculator/font/" class="tool-link">
                        <i class="fas fa-font"></i>
                        <span>폰트 계산기</span>
                    </a>
                    <a href="/studio/calculator/text-tools/" class="tool-link">
                        <i class="fas fa-align-left"></i>
                        <span>텍스트 도구</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

{{ end }}
