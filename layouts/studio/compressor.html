{{ define "main" }}

<link rel="stylesheet" href="{{ "/css/studiopage.css" | relURL }}">

<section class="studio-page-section">
    <div class="container">
        <!-- 헤더 -->
        <div class="studio-page-header">
            <h1>{{ .Title }}</h1>
            <p>{{ .Description }}</p>
        </div>

        <!-- 이미지 압축기 컨텐츠 -->
        <div class="studio-page-content">
            <div class="studio-tab-panel active">
                <div class="image-compressor-container">
                    <div class="studio-upload-area" id="compress-image-upload" onclick="document.getElementById('compress-image-files').click()">
                        <div class="studio-upload-icon">
                            <i class="fas fa-compress-alt"></i>
                        </div>
                        <h3>이미지 선택</h3>
                        <p>압축할 이미지를 선택하세요 (다중 선택 가능)</p>
                        <input type="file" id="compress-image-files" accept="image/*" multiple style="display: none;">
                    </div>
                    
                    <div class="compression-options" id="compression-options" style="display: none;">
                        <div class="studio-input-group">
                            <label for="compression-quality">압축 품질 (<span id="compression-value">80</span>%)</label>
                            <input type="range" id="compression-quality" min="10" max="100" value="80" class="quality-slider">
                            <small>품질이 낮을수록 파일 크기가 작아집니다</small>
                        </div>
                        
                        <div class="studio-input-group">
                            <label>
                                <input type="checkbox" id="keep-original-size"> 원본 크기 유지
                            </label>
                            <small>체크 해제 시 적절한 크기로 자동 조절됩니다</small>
                        </div>
                        
                        <button class="studio-page-btn" id="compress-btn">이미지 압축</button>
                    </div>
                    
                    <div class="compression-result" id="compression-result" style="display: none;">
                        <h3>압축 완료</h3>
                        <div class="compression-stats" id="compression-stats"></div>
                        <div class="compressed-images" id="compressed-images"></div>
                        <button class="studio-page-btn" id="download-all-compressed">전체 다운로드</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="{{ "/js/studiopage.js" | relURL }}"></script>

{{ end }}
