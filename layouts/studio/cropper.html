{{ define "main" }}

<link rel="stylesheet" href="{{ "/css/studiopage.css" | relURL }}">

<section class="studio-page-section">
    <div class="container">
        <!-- 헤더 -->
        <div class="studio-page-header">
            <h1>{{ .Title }}</h1>
            <p>{{ .Description }}</p>
        </div>

        <!-- 이미지 자르기 컨텐츠 -->
        <div class="studio-page-content">
            <div class="studio-tab-panel active">
                <div class="image-cropper-container">
                    <div class="studio-upload-area" id="crop-image-upload" onclick="document.getElementById('crop-image-file').click()">
                        <div class="studio-upload-icon">
                            <i class="fas fa-crop-alt"></i>
                        </div>
                        <h3>이미지 선택</h3>
                        <p>자를 이미지를 선택하세요</p>
                        <input type="file" id="crop-image-file" accept="image/*" style="display: none;">
                    </div>
                    
                    <div class="crop-editor" id="crop-editor" style="display: none;">
                        <div class="crop-canvas-container">
                            <canvas id="crop-canvas"></canvas>
                            <div class="crop-selection" id="crop-selection"></div>
                        </div>
                        
                        <div class="crop-controls">
                            <div class="studio-input-group">
                                <label>자르기 영역</label>
                                <div class="crop-coordinates">
                                    <span>X: <span id="crop-x">0</span>px</span>
                                    <span>Y: <span id="crop-y">0</span>px</span>
                                    <span>너비: <span id="crop-width">0</span>px</span>
                                    <span>높이: <span id="crop-height">0</span>px</span>
                                </div>
                            </div>
                            
                            <div class="preset-ratios">
                                <button class="ratio-btn" data-ratio="1:1">1:1</button>
                                <button class="ratio-btn" data-ratio="4:3">4:3</button>
                                <button class="ratio-btn" data-ratio="16:9">16:9</button>
                                <button class="ratio-btn" data-ratio="free">자유</button>
                            </div>
                            
                            <button class="studio-page-btn" id="crop-btn">자르기</button>
                        </div>
                    </div>
                    
                    <div class="crop-result" id="crop-result" style="display: none;">
                        <h3>자르기 완료</h3>
                        <div class="cropped-preview" id="cropped-preview"></div>
                        <button class="studio-page-btn" id="download-cropped">다운로드</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="{{ "/js/studiopage.js" | relURL }}"></script>

{{ end }}
