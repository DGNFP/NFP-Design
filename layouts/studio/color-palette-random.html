<script>
// HSL to HEX 변환 함수
function hslToHex(h, s, l) {
    l /= 100;
    const a = s * Math.min(l, 1 - l) / 100;
    const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
    };
    return `#${f(0)}${f(8)}${f(4)}`;
}

// 색상 복사 피드백 함수 (랜덤 전용)
function copyRandomColorWithFeedback(color) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(color);
    }
    
    // 토스트 알림 생성
    showRandomCopyToast();
}

function showRandomCopyToast() {
    // 기존 토스트 제거
    const existingToast = document.querySelector('.random-copy-toast');
    if (existingToast) {
        existingToast.remove();
    }
    
    // 새 토스트 생성
    const toast = document.createElement('div');
    toast.className = 'random-copy-toast';
    toast.innerHTML = '<i class="fas fa-check"></i> 랜덤 색상 복사됨!';
    toast.style.cssText = `
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #01FF75;;
        color: black;
        padding: 12px 24px;
        border-radius: 25px;
        font-weight: 600;
        z-index: 10000;
        animation: randomToastShow 0.3s ease;
    `;
    
    // CSS 애니메이션 추가
    if (!document.querySelector('#random-toast-style')) {
        const style = document.createElement('style');
        style.id = 'random-toast-style';
        style.textContent = `
            @keyframes randomToastShow {
                from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
                to { opacity: 1; transform: translateX(-50%) translateY(0); }
            }
        `;
        document.head.appendChild(style);
    }
    
    document.body.appendChild(toast);
    
    // 2초 후 제거
    setTimeout(() => {
        if (toast.parentNode) {
            toast.style.animation = 'randomToastShow 0.3s ease reverse';
            setTimeout(() => toast.remove(), 300);
        }
    }, 2000);
}

// 완전히 랜덤한 5색 팔레트 생성 함수
function generateCompletelyRandomPalette() {
    const button = document.getElementById('palette-random-btn');
    const result = document.getElementById('palette-random-result');
    
    if (!button || !result) return;
    
    button.disabled = true;
    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 생성 중...';
    
    setTimeout(() => {
        // 완전히 관계없는 5개의 랜덤 컬러 생성
        const colors = [];
        
        for (let i = 0; i < 5; i++) {
            const hue = Math.floor(Math.random() * 360);        // 0-360도 전체 범위
            const saturation = 40 + Math.floor(Math.random() * 60);  // 40-100% (너무 흐리지 않게)
            const lightness = 30 + Math.floor(Math.random() * 50);   // 30-80% (너무 어둡거나 밝지 않게)
            
            const hex = hslToHex(hue, saturation, lightness);
            colors.push(hex);
        }
        
        // 랜덤 팔레트 표시
        result.innerHTML = `
            <div class="palette-random-colors">
                ${colors.map((color, index) => `
                    <div class="palette-random-item" onclick="copyRandomColorWithFeedback('${color}')">
                        <div class="palette-random-color" style="background-color: ${color}"></div>
                        <div class="palette-random-color-code">${color}</div>
                    </div>
                `).join('')}
            </div>
        `;
        
        // 가끔 랜덤하게 반짝이는 효과 추가
        setTimeout(() => {
            const items = document.querySelectorAll('.palette-random-item');
            const randomIndex = Math.floor(Math.random() * items.length);
            if (items[randomIndex]) {
                items[randomIndex].classList.add('sparkle');
                setTimeout(() => {
                    items[randomIndex].classList.remove('sparkle');
                }, 600);
            }
        }, 200);
        
        result.style.display = 'block';
        
        button.disabled = false;
        button.innerHTML = '<i class="fas fa-dice"></i> 랜덤 팔레트 생성';
    }, 1000);
}

// 페이지 로드 시 이벤트 리스너 등록
document.addEventListener('DOMContentLoaded', function() {
    const button = document.getElementById('palette-random-btn');
    if (button) {
        button.addEventListener('click', generateCompletelyRandomPalette);
    }
});
</script>
