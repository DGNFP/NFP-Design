{{ define "main" }}

<link rel="stylesheet" href="{{ "/css/studiopage.css" | relURL }}">

<section class="studio-page-section">
    <div class="container">
        <!-- 헤더 -->
        <div class="studio-page-header">
            <h1>{{ .Title }}</h1>
            <p>{{ .Description }}</p>
        </div>

        <!-- PDF 압축기 컨텐츠 -->
        <div class="studio-page-content">
            <div class="studio-tab-panel active">
                <div class="pdf-compressor-container">
                    <div class="studio-upload-area" id="pdf-upload" onclick="document.getElementById('pdf-file').click()">
                        <div class="studio-upload-icon">
                            <i class="fas fa-file-pdf"></i>
                        </div>
                        <h3>PDF 파일 선택</h3>
                        <p>압축할 PDF 파일을 선택하세요</p>
                        <input type="file" id="pdf-file" accept=".pdf" style="display: none;">
                    </div>
                    
                    <div class="pdf-options" id="pdf-options" style="display: none;">
                        <div class="file-info" id="file-info">
                            <h4>파일 정보</h4>
                            <p id="original-size">원본 크기: -</p>
                            <p id="page-count">페이지 수: -</p>
                        </div>
                        
                        <div class="studio-input-group">
                            <label for="compression-level">압축 레벨</label>
                            <select id="compression-level" class="studio-form-input">
                                <option value="low">낮음 (고품질)</option>
                                <option value="medium" selected>중간 (균형)</option>
                                <option value="high">높음 (최대 압축)</option>
                            </select>
                            <small>압축 레벨이 높을수록 파일 크기가 작아지지만 품질이 저하될 수 있습니다</small>
                        </div>
                        
                        <button class="studio-page-btn" id="compress-pdf-btn">PDF 압축</button>
                    </div>
                    
                    <div class="pdf-result" id="pdf-result" style="display: none;">
                        <h3>압축 완료</h3>
                        <div class="compression-summary" id="compression-summary"></div>
                        <button class="studio-page-btn" id="download-compressed-pdf">다운로드</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="{{ "/js/studiopage.js" | relURL }}"></script>

{{ end }}
