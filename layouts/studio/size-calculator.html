{{ define "main" }}

<link rel="stylesheet" href="{{ "/css/studiopage.css" | relURL }}">

<section class="studio-page-section">
    <div class="container">
        <!-- 헤더 -->
        <div class="studio-page-header">
            <h1>{{ .Title }}</h1>
            <p>{{ .Description }}</p>
        </div>

        <!-- 사이즈 계산기 컨텐츠 -->
        <div class="studio-page-content">
            <div class="studio-tab-panel active">
                <!-- 비율 계산기 -->
                <div class="studio-calc-section">
                    <h3>비율 계산기</h3>
                    <p class="studio-calc-desc">비율을 입력하면 다양한 해상도를 자동으로 계산해드립니다.</p>
                    
                    <div class="studio-input-row">
                        <div class="studio-input-col">
                            <label>가로 비율</label>
                            <div class="studio-input-with-unit">
                                <input type="number" id="ratio-width" value="16" min="1" max="50">
                                <span>비율</span>
                            </div>
                        </div>
                        <div class="studio-input-col">
                            <label>세로 비율</label>
                            <div class="studio-input-with-unit">
                                <input type="number" id="ratio-height" value="9" min="1" max="50">
                                <span>비율</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="studio-grid-result-info" id="ratio-results">
                        <div class="studio-result-item">
                            <span>초고화질(4K)</span>
                            <span id="ratio-4k">3840×2160</span>
                        </div>
                        <div class="studio-result-item">
                            <span>고화질(Full HD)</span>
                            <span id="ratio-fhd">1920×1080</span>
                        </div>
                        <div class="studio-result-item">
                            <span>표준화질(HD)</span>
                            <span id="ratio-hd">1280×720</span>
                        </div>
                        <div class="studio-result-item">
                            <span>일반화질(SD)</span>
                            <span id="ratio-sd">854×480</span>
                        </div>
                    </div>
                </div>

                <!-- 커스텀 사이즈 변환 -->
                <div class="studio-calc-section">
                    <h3>커스텀 사이즈 변환</h3>
                    <p class="studio-calc-desc">원본 이미지를 원하는 비율로 변환합니다. 잘라내기와 늘리기 두 가지 방식으로 결과를 제공합니다.</p>
                    
                    <div class="studio-input-row">
                        <div class="studio-input-col">
                            <label>원본 너비</label>
                            <div class="studio-input-with-unit">
                                <input type="number" id="original-width" placeholder="1200" min="1">
                                <span>px</span>
                            </div>
                        </div>
                        <div class="studio-input-col">
                            <label>원본 높이</label>
                            <div class="studio-input-with-unit">
                                <input type="number" id="original-height" placeholder="800" min="1">
                                <span>px</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="studio-input-row">
                        <div class="studio-input-col">
                            <label>목표 비율 (가로)</label>
                            <div class="studio-input-with-unit">
                                <input type="number" id="target-ratio-width" placeholder="1" min="1">
                                <span>비율</span>
                            </div>
                        </div>
                        <div class="studio-input-col">
                            <label>목표 비율 (세로)</label>
                            <div class="studio-input-with-unit">
                                <input type="number" id="target-ratio-height" placeholder="1" min="1">
                                <span>비율</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="studio-grid-result-info" id="convert-results">
                        <div class="studio-result-item">
                            <span>잘라내기 (작게)</span>
                            <span id="crop-result">-</span>
                        </div>
                        <div class="studio-result-item">
                            <span>늘리기 (크게)</span>
                            <span id="fit-result">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="{{ "/js/studiopage.js" | relURL }}"></script>

{{ end }}
