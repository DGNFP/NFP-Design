{{ define "main" }}

<link rel="stylesheet" href="{{ "/css/studiopage.css" | relURL }}">

<section class="studio-page-section">
    <div class="container">
        <!-- 헤더 -->
        <div class="studio-page-header">
            <h1>{{ .Title }}</h1>
            <p>{{ .Description }}</p>
        </div>

        <!-- 랜덤 5색 팔레트 컨텐츠 -->
        <div class="studio-page-content">
            <div class="studio-tab-panel active">
                <div class="palette-generator-container">
                    <button class="studio-pick-btn" id="palette-random-btn">
                        <i class="fas fa-dice"></i> 랜덤 팔레트 생성
                    </button>
                    <div class="palette-5-result" id="palette-random-result" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="{{ "/components/cardcounter.js" | relURL }}"></script>
<script src="{{ "/js/studiopage.js" | relURL }}"></script>

{{ end }}
