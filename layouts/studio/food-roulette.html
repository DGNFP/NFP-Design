{{ define "main" }}
<link rel="stylesheet" href="{{ "/css/studiopage.css" | relURL }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* 오늘 뭐먹지 전용 스타일 */
.food-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}

.food-category-section {
    background: var(--sub-bg-color);
    border: 1px solid var(--sub-border-color);
    border-radius: 4px;
    padding: 30px;
    margin-bottom: 30px;
    text-align: center;
}

.food-category-title {
    color: var(--accent-color);
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

.food-category-options {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}

.food-radio-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.food-radio {
    width: 20px;
    height: 20px;
    accent-color: var(--accent-color);
}

.food-radio-label {
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

.food-radio-label:hover {
    color: var(--accent-color);
}

.food-roulette-section {
    background: var(--sub-bg-color);
    border: 1px solid var(--sub-border-color);
    border-radius: 4px;
    padding: 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.food-roulette-container {
    position: relative;
    width: 350px;
    height: 350px;
    margin: 0 auto 30px;
}

.food-roulette-wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    border: 4px solid var(--accent-color);
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    box-shadow: 0 0 20px rgba(1, 255, 117, 0.3);
    overflow: hidden;
    transform: rotate(0deg);
}

.food-roulette-svg {
    width: 100%;
    height: 100%;
}

.food-roulette-pointer {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 30px solid var(--accent-color);
    z-index: 10;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
}

.food-roulette-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background: var(--accent-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    box-shadow: 0 0 15px rgba(1, 255, 117, 0.5);
}

.food-roulette-center i {
    color: #000;
    font-size: 28px;
}

.food-spin-button {
    background: var(--accent-color);
    color: #000;
    border: none;
    padding: 15px 40px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 0 auto;
}

.food-spin-button:hover {
    background: #00e066;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(1, 255, 117, 0.3);
}

.food-spin-button:disabled {
    background: #141414;
    color: #999;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.food-result-section {
    background: #1a1a1a;
    border: 1px solid var(--sub-border-color);
    border-radius: 4px;
    padding: 30px;
    margin-top: 30px;
    text-align: center;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.food-result-text {
    color: white;
    font-size: 24px;
    font-weight: bold;
}

.food-result-highlight {
    color: var(--accent-color);
    font-size: 32px;
    display: block;
    margin: 10px 0;
}

.food-result-section.show-result {
    animation: resultShow 0.8s ease-out;
}

@keyframes resultShow {
    0% { 
        transform: scale(0.8);
        opacity: 0;
    }
    50% {
        transform: scale(1.05);
    }
    100% { 
        transform: scale(1);
        opacity: 1;
    }
}

/* 모바일 반응형 */
@media (max-width: 768px) {
    .food-category-options {
        gap: 20px;
    }
    
    .food-roulette-container {
        width: 280px;
        height: 280px;
    }
    
    .food-result-text {
        font-size: 20px;
    }
    
    .food-result-highlight {
        font-size: 28px;
    }
}
</style>

<section class="section">
<div class="container">
    <!-- 헤더 -->
    <div class="studio-page-header">
        <h1>Studio <span>NFP</span></h1>
        <span class="highlight">오늘 뭐먹지?</span>
        <p><br>메뉴 선택 고민 끝! 룰렛으로 결정해보세요.</p>
    </div>

    <!-- 다른 페이지로 이동 버튼 -->
    <div class="page-btn-wrapper">
        <a href="{{ "/studio" | relURL }}" class="page-btn">스튜디오 메인</a>
        <a href="{{ "/studio/web-demo" | relURL }}" class="page-btn">웹 데모</a>
        <a href="{{ "/studio/design-guide/" | relURL }}" class="page-btn">디자인 가이드</a>
    </div>

    <!-- 컨텐츠 -->
    <div class="studio-page-content"> 
        <div class="studio-container">
            <!-- 설명 -->
            <div class="studio-description">
                <h3>오늘 뭐먹지?</h3>
                <p>점심 뭐먹지? 저녁 뭐먹지? 고민될 때 룰렛으로 해결하세요!<br>
                한식, 중식, 양식 카테고리별로 다양한 메뉴를 추천해드립니다.</p>
                <div class="supported-formats">
                    <small>점메추 • 저메추 • 점심메뉴추천 • 저녁메뉴추천 • 메뉴룰렛</small>
                </div>
            </div>

            <!-- 음식 룰렛 컨테이너 -->
            <div class="food-container">
                <!-- 카테고리 선택 -->
                <div class="food-category-section">
                    <div class="food-category-title">음식 카테고리 선택</div>
                    <div class="food-category-options">
                        <div class="food-radio-group">
                            <input type="radio" id="categoryKorean" name="foodCategory" value="korean" class="food-radio" checked>
                            <label for="categoryKorean" class="food-radio-label">한식</label>
                        </div>
                        <div class="food-radio-group">
                            <input type="radio" id="categoryChinese" name="foodCategory" value="chinese" class="food-radio">
                            <label for="categoryChinese" class="food-radio-label">중식</label>
                        </div>
                        <div class="food-radio-group">
                            <input type="radio" id="categoryWestern" name="foodCategory" value="western" class="food-radio">
                            <label for="categoryWestern" class="food-radio-label">양식</label>
                        </div>
                    </div>
                </div>

                <!-- 룰렛 섹션 -->
                <div class="food-roulette-section">
                    <div class="food-roulette-container">
                        <div class="food-roulette-pointer"></div>
                        <div class="food-roulette-wheel" id="rouletteWheel">
                            <svg class="food-roulette-svg" id="rouletteSVG" viewBox="0 0 350 350">
                                <!-- SVG 파이 슬라이스들이 여기에 생성됩니다 -->
                            </svg>
                        </div>
                        <div class="food-roulette-center">
                            <i class="fas fa-utensils"></i>
                        </div>
                    </div>
                    
                    <button class="food-spin-button" id="spinButton">
                        <i class="fas fa-sync-alt"></i>
                        룰렛 돌리기
                    </button>
                </div>

                <!-- 결과 표시 -->
                <div class="food-result-section" id="resultSection">
                    <div class="food-result-text">
                        카테고리를 선택하고 룰렛을 돌려보세요!
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</section>

<script>
// 음식 데이터
var foodList = {
    korean: [
        '김치찌개', '된장찌개', '불고기', '비빔밥', 
        '냉면', '갈비탕', '삼겹살', '김치볶음밥'
    ],
    chinese: [
        '짜장면', '짬뽕', '탕수육', '볶음밥',
        '마파두부', '깐풍기', '양장피', '잡채밥'
    ],
    western: [
        '파스타', '피자', '스테이크', '햄버거',
        '샐러드', '리조또', '오므라이스', '샌드위치'
    ]
};

var currentCategory = 'korean';
var isSpinning = false;

// 룰렛 생성
function createRoulette(foods) {
    var svg = document.getElementById('rouletteSVG');
    svg.innerHTML = '';
    
    var centerX = 175;
    var centerY = 175;
    var radius = 150;
    
    // 어두운 톤의 조화로운 색상 팔레트
    var darkColors = [
        '#2c3e50', '#34495e', '#5d4e75', '#8e44ad',
        '#2980b9', '#16a085', '#27ae60', '#f39c12'
    ];
    
    var anglePerSlice = 360 / foods.length;
    
    for (var i = 0; i < foods.length; i++) {
        var startAngle = -90 + (i * anglePerSlice);
        var endAngle = -90 + ((i + 1) * anglePerSlice);
        
        var startRad = (startAngle * Math.PI) / 180;
        var endRad = (endAngle * Math.PI) / 180;
        
        var x1 = centerX + radius * Math.cos(startRad);
        var y1 = centerY + radius * Math.sin(startRad);
        var x2 = centerX + radius * Math.cos(endRad);
        var y2 = centerY + radius * Math.sin(endRad);
        
        var largeArcFlag = anglePerSlice > 180 ? 1 : 0;
        
        var path = 'M ' + centerX + ' ' + centerY + 
                  ' L ' + x1 + ' ' + y1 + 
                  ' A ' + radius + ' ' + radius + ' 0 ' + largeArcFlag + ' 1 ' + x2 + ' ' + y2 + 
                  ' Z';
        
        var slice = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        slice.setAttribute('d', path);
        slice.setAttribute('fill', darkColors[i % darkColors.length]);
        slice.setAttribute('stroke', '#141414');
        slice.setAttribute('stroke-width', '2');
        
        svg.appendChild(slice);
        
        // 텍스트
        var textAngle = startAngle + (anglePerSlice / 2);
        var textRadius = radius * 0.7;
        var textX = centerX + textRadius * Math.cos((textAngle * Math.PI) / 180);
        var textY = centerY + textRadius * Math.sin((textAngle * Math.PI) / 180);
        
        var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', textX);
        text.setAttribute('y', textY);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', 'white');
        text.setAttribute('font-size', '15');
        text.setAttribute('font-weight', 'bold');
        text.textContent = foods[i];
        
        svg.appendChild(text);
    }
}

// 카테고리 변경
function onCategoryChange() {
    var selected = document.querySelector('input[name="foodCategory"]:checked');
    if (selected) {
        currentCategory = selected.value;
        createRoulette(foodList[currentCategory]);
        
        var result = document.getElementById('resultSection');
        result.innerHTML = '<div class="food-result-text">룰렛을 돌려보세요!</div>';
        result.classList.remove('show-result');
    }
}

// 룰렛 돌리기
function spinRoulette() {
    if (isSpinning) return;
    
    isSpinning = true;
    var button = document.getElementById('spinButton');
    var wheel = document.getElementById('rouletteWheel');
    var result = document.getElementById('resultSection');
    
    button.disabled = true;
    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 돌리는 중...';
    
    result.innerHTML = '<div class="food-result-text">룰렛이 돌아가고 있어요...</div>';
    result.classList.remove('show-result');
    
    // 처음부터 시작
    wheel.style.transition = 'none';
    wheel.style.transform = 'rotate(0deg)';
    
    setTimeout(function() {
        wheel.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
        
        var foods = foodList[currentCategory];
        var anglePerSlice = 360 / foods.length;
        
        var spins = 5 + Math.random() * 3;
        var finalAngle = 360 * spins + Math.random() * 360;
        
        wheel.style.transform = 'rotate(' + finalAngle + 'deg)';
        
        setTimeout(function() {
            var normalizedAngle = (360 - (finalAngle % 360)) % 360;
            var selectedIndex = Math.floor(normalizedAngle / anglePerSlice) % foods.length;
            var selectedFood = foods[selectedIndex];
            
            result.innerHTML = 
                '<div class="food-result-text">' +
                '오늘의 메뉴는' +
                '<span class="food-result-highlight">' + selectedFood + '</span>' +
                '어떠세요?' +
                '</div>';
            
            result.classList.add('show-result');
            
            isSpinning = false;
            button.disabled = false;
            button.innerHTML = '<i class="fas fa-sync-alt"></i> 다시 돌리기';
        }, 4200);
        
    }, 50);
}

// 이벤트 등록
document.addEventListener('DOMContentLoaded', function() {
    var radios = document.querySelectorAll('input[name="foodCategory"]');
    for (var i = 0; i < radios.length; i++) {
        radios[i].addEventListener('change', onCategoryChange);
    }
    
    document.getElementById('spinButton').addEventListener('click', spinRoulette);
    
    createRoulette(foodList[currentCategory]);
});
</script>

{{ end }}
