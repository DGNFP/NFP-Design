{{ define "main" }}

<link rel="stylesheet" href="{{ "/css/studiopage.css" | relURL }}">

<section class="studio-page-section">
    <div class="container">
        <!-- 헤더 -->
        <div class="studio-page-header">
            <h1>{{ .Title }}</h1>
            <p>{{ .Description }}</p>
        </div>

        <!-- 이미지 포맷 변환기 컨텐츠 -->
        <div class="studio-page-content">
            <div class="studio-tab-panel active">
                <div class="image-converter-container">
                    <div class="studio-upload-area" id="format-image-upload" onclick="document.getElementById('format-image-file').click()">
                        <div class="studio-upload-icon">
                            <i class="fas fa-images"></i>
                        </div>
                        <h3>이미지 선택</h3>
                        <p>변환할 이미지를 선택하세요</p>
                        <input type="file" id="format-image-file" accept="image/*" style="display: none;">
                    </div>
                    
                    <div class="format-options" id="format-options" style="display: none;">
                        <div class="studio-input-group">
                            <label for="target-format">변환할 포맷</label>
                            <select id="target-format" class="studio-form-input">
                                <option value="png">PNG</option>
                                <option value="jpg">JPG</option>
                                <option value="webp">WebP</option>
                            </select>
                        </div>
                        
                        <div class="studio-input-group" id="quality-group" style="display: none;">
                            <label for="image-quality">품질 (<span id="quality-value">90</span>%)</label>
                            <input type="range" id="image-quality" min="10" max="100" value="90" class="quality-slider">
                        </div>
                        
                        <button class="studio-page-btn" id="convert-btn">포맷 변환</button>
                    </div>
                    
                    <div class="conversion-result" id="conversion-result" style="display: none;">
                        <h3>변환 완료</h3>
                        <div class="result-preview" id="result-preview"></div>
                        <button class="studio-page-btn" id="download-converted">다운로드</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="{{ "/js/studiopage.js" | relURL }}"></script>

{{ end }}
