{{ define "main" }}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<section class="section">
<div class="container">
    <!-- 헤더 -->
    <div class="studio-page-header">
        <h1>Studio <span>NFP</span></h1>
        <span class="highlight">벽돌깨기 게임</span>
        <p><br>패들로 공을 튕겨 모든 벽돌을 깨뜨리세요.</p>
    </div>

    <!-- 다른 페이지로 이동 버튼 -->
    <div class="page-btn-wrapper">
        <a href="{{ "/studio" | relURL }}" class="page-btn">스튜디오 메인</a>
        <a href="{{ "/studio/web-demo" | relURL }}" class="page-btn">웹 데모</a>
        <a href="{{ "/studio/design-guide/" | relURL }}" class="page-btn">디자인 가이드</a>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="studio-page-content"> 
        <div class="studio-container">
            <!-- 설명 -->
            <div class="studio-description">
                <h3>클래식 벽돌깨기</h3>
                <p>패들을 움직여 공을 튕기고 모든 벽돌을 파괴하세요!<br>
                #벽돌깨기 #브레이크아웃 #아케이드게임</p>
            </div>

            <!-- 메인 게임 영역 -->
            <div class="breakout-game-container">
                
                <!-- 게임 헤더 -->
                <div class="game-header">
                    <div class="game-stats">
                        <div class="stat-item">
                            <i class="fas fa-trophy"></i>
                            <span class="stat-label">점수</span>
                            <span class="stat-value" id="scoreValue">0</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-heart"></i>
                            <span class="stat-label">생명</span>
                            <span class="stat-value" id="livesValue">3</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-layer-group"></i>
                            <span class="stat-label">레벨</span>
                            <span class="stat-value" id="levelValue">1</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-cubes"></i>
                            <span class="stat-label">남은 벽돌</span>
                            <span class="stat-value" id="bricksLeft">0</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-star"></i>
                            <span class="stat-label">최고 점수</span>
                            <span class="stat-value" id="bestScore">0</span>
                        </div>
                    </div>
                </div>

                <!-- 게임 상태 -->

                    <div class="status-content">
                        <i class="fas fa-play-circle"></i>
                        <h3>게임 준비</h3>
                        <p>시작 버튼을 눌러 게임을 시작하세요!</p>
                        <div class="controls-info">

                            <span><i class="fas fa-mouse-pointer"></i> 클릭으로 공 발사</span>
                        </div>
                    </div>
                </div>

                <!-- 게임 캔버스 -->
                <div class="game-canvas-container">
                    <canvas id="gameCanvas" width="800" height="600"></canvas>
                    <div class="game-overlay" id="gameOverlay">
                        <div class="overlay-content">
                            <i class="fas fa-flag-checkered" id="overlayIcon"></i>
                            <h3 id="overlayTitle">게임 종료</h3>
                            <p id="overlayMessage">게임이 종료되었습니다.</p>
                            <div class="overlay-stats" id="overlayStats">
                                <div class="overlay-stat">
                                    <span>최종 점수</span>
                                    <span id="finalScore">0</span>
                                </div>
                                <div class="overlay-stat">
                                    <span>도달 레벨</span>
                                    <span id="finalLevel">1</span>
                                </div>
                            </div>
                            <div class="overlay-actions">
                                <button class="overlay-btn" id="playAgainBtn">
                                    <i class="fas fa-play"></i>
                                    <span>다시 하기</span>
                                </button>
                                <button class="overlay-btn secondary" id="nextLevelBtn" style="display: none;">
                                    <i class="fas fa-arrow-right"></i>
                                    <span>다음 레벨</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <button class="control-btn start-btn" id="startBtn">

                    </button>
                    <button class="control-btn pause-btn" id="pauseBtn" style="display: none;">

                    </button>
                    <button class="control-btn reset-btn" id="resetBtn">
                        <i class="fas fa-redo"></i>
                        <span>리셋</span>
                    </button>
                    <button class="control-btn settings-btn" id="settingsBtn">
                        <i class="fas fa-cog"></i>
                        <span>설정</span>

                        <h4>게임 설정</h4>
                        <button class="close-settings" id="closeSettings">

                        </div>

                                <input type="range" id="ballSpeedSlider" min="3" max="8" value="5">

                    </div>

            </div>

<script>
class BreakoutGame {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        
        // 게임 상태
        this.isPlaying = false;
        this.isPaused = false;
        this.waitingForLaunch = false;
        this.animationId = null;
        
        // 점수 및 상태
        this.score = 0;
        this.lives = 3;
        this.level = 1;
        this.bestScore = 0;
        
        // 설정
        this.difficulty = 'normal';
        this.paddleSize = 'normal';
        this.ballSpeed = 5;
        
        // 게임 객체
        this.ball = {
            x: this.canvas.width / 2,
            y: this.canvas.height - 100,
            radius: 8,
            velocityX: 0,
            velocityY: 0,
            speed: this.ballSpeed,
            attached: true
        };
        
        this.paddle = {
            x: this.canvas.width / 2 - 60,
            y: this.canvas.height - 40,
            width: 120,
            height: 16
        };
        
        this.bricks = [];
        this.particles = [];
        this.mouseX = this.canvas.width / 2;
        
        this.init();
    }
    
    init() {
        this.loadBestScore();
        this.setupEventListeners();
        this.createBricks();
        this.updateDisplay();
        this.showGameStatus();
        this.draw();
    }
    
    setupEventListeners() {
        // 마우스 이벤트
        this.canvas.addEventListener('mousemove', (e) => {
            const rect = this.canvas.getBoundingClientRect();
            this.mouseX = e.clientX - rect.left;
        });
        
        this.canvas.addEventListener('click', () => {
            if (this.waitingForLaunch && this.ball.attached) {
                this.launchBall();
            }
        });
        
        // 버튼 이벤트
        document.getElementById('startBtn').addEventListener('click', () => this.startGame());
        document.getElementById('pauseBtn').addEventListener('click', () => this.togglePause());
        document.getElementById('resetBtn').addEventListener('click', () => this.resetGame());
        document.getElementById('settingsBtn').addEventListener('click', () => this.showSettings());
        document.getElementById('closeSettings').addEventListener('click', () => this.hideSettings());
        document.getElementById('playAgainBtn').addEventListener('click', () => this.playAgain());
        document.getElementById('nextLevelBtn').addEventListener('click', () => this.nextLevel());
        
        // 설정 이벤트
        document.querySelectorAll('[data-difficulty]').forEach(btn => {
            btn.addEventListener('click', (e) => this.setDifficulty(e.target.dataset.difficulty));
        });
        
        document.querySelectorAll('[data-paddle]').forEach(btn => {
            btn.addEventListener('click', (e) => this.setPaddleSize(e.target.dataset.paddle));
        });
        
        document.getElementById('ballSpeedSlider').addEventListener('input', (e) => {
            this.ballSpeed = parseInt(e.target.value);
            this.ball.speed = this.ballSpeed;
            document.getElementById('ballSpeedValue').textContent = this.ballSpeed;
        });
    }
    
    createBricks() {
        this.bricks = [];
        const rows = 5 + Math.floor(this.level / 3);
        const cols = 10;
        const brickWidth = 70;
        const brickHeight = 20;
        const padding = 5;
        const offsetTop = 60;
        const offsetLeft = (this.canvas.width - (cols * (brickWidth + padding) - padding)) / 2;
        
        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD'];
        
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                this.bricks.push({
                    x: offsetLeft + col * (brickWidth + padding),
                    y: offsetTop + row * (brickHeight + padding),
                    width: brickWidth,
                    height: brickHeight,
                    visible: true,
                    color: colors[row % colors.length],
                    points: (rows - row) * 10,
                    hits: row < 2 ? 2 : 1
                });
            }
        }
        
        this.updateBricksLeft();
    }
    
    startGame() {
        this.isPlaying = true;
        this.isPaused = false;
        this.waitingForLaunch = true;
        this.ball.attached = true;
        this.hideGameStatus();
        this.showPauseButton();
        this.gameLoop();
    }
    
    launchBall() {
        this.ball.attached = false;
        this.waitingForLaunch = false;
        
        const angle = -Math.PI/2 + (Math.random() - 0.5) * Math.PI/3;
        this.ball.velocityX = Math.cos(angle) * this.ball.speed;
        this.ball.velocityY = Math.sin(angle) * this.ball.speed;
    }
    
    togglePause() {
        this.isPaused = !this.isPaused;
        
        if (this.isPaused) {
            this.showGameStatus('paused');
            document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-play"></i><span>계속하기</span>';
            cancelAnimationFrame(this.animationId);
        } else {
            this.hideGameStatus();
            document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-pause"></i><span>일시정지</span>';
            this.gameLoop();
        }
    }
    
    resetGame() {
        this.stopGame();
        this.score = 0;
        this.lives = 3;
        this.level = 1;
        this.resetBall();
        this.resetPaddle();
        this.createBricks();
        this.particles = [];
        this.updateDisplay();
        this.showGameStatus();
        this.showStartButton();
        this.draw();
    }
    
    stopGame() {
        this.isPlaying = false;
        this.isPaused = false;
        this.waitingForLaunch = false;
        if (this.animationId) {
            cancelAnimationFrame(this.animationId);
        }
    }
    
    gameLoop() {
        if (!this.isPlaying || this.isPaused) return;
        
        this.update();
        this.draw();
        this.animationId = requestAnimationFrame(() => this.gameLoop());
    }
    
    update() {
        // 패들 업데이트
        const targetX = this.mouseX - this.paddle.width / 2;
        this.paddle.x = Math.max(0, Math.min(this.canvas.width - this.paddle.width, targetX));
        
        // 공이 패들에 붙어있을 때
        if (this.ball.attached) {
            this.ball.x = this.paddle.x + this.paddle.width / 2;
            return;
        }
        
        // 공 이동
        this.ball.x += this.ball.velocityX;
        this.ball.y += this.ball.velocityY;
        
        // 벽 충돌
        if (this.ball.x <= this.ball.radius || this.ball.x >= this.canvas.width - this.ball.radius) {
            this.ball.velocityX = -this.ball.velocityX;
        }
        
        if (this.ball.y <= this.ball.radius) {
            this.ball.velocityY = -this.ball.velocityY;
        }
        
        // 바닥 충돌
        if (this.ball.y >= this.canvas.height - this.ball.radius) {
            this.loseLife();
        }
        
        // 패들 충돌
        this.checkPaddleCollision();
        
        // 벽돌 충돌
        this.checkBrickCollision();
        
        // 파티클 업데이트
        this.updateParticles();
        
        // 레벨 완료 체크
        this.checkLevelComplete();
        
        this.updateDisplay();
    }
    
    checkPaddleCollision() {
        if (this.ball.y + this.ball.radius >= this.paddle.y &&
            this.ball.x >= this.paddle.x &&
            this.ball.x <= this.paddle.x + this.paddle.width &&
            this.ball.velocityY > 0) {
            
            const paddleCenter = this.paddle.x + this.paddle.width / 2;
            const ballRelativeX = this.ball.x - paddleCenter;
            const normalizedX = ballRelativeX / (this.paddle.width / 2);
            
            const angle = normalizedX * Math.PI / 3;
            const speed = Math.sqrt(this.ball.velocityX ** 2 + this.ball.velocityY ** 2);
            
            this.ball.velocityX = Math.sin(angle) * speed;
            this.ball.velocityY = -Math.abs(Math.cos(angle) * speed);
            this.ball.y = this.paddle.y - this.ball.radius;
        }
    }
    
    checkBrickCollision() {
        for (let i = 0; i < this.bricks.length; i++) {
            const brick = this.bricks[i];
            if (!brick.visible) continue;
            
            if (this.ball.x + this.ball.radius >= brick.x &&
                this.ball.x - this.ball.radius <= brick.x + brick.width &&
                this.ball.y + this.ball.radius >= brick.y &&
                this.ball.y - this.ball.radius <= brick.y + brick.height) {
                
                this.hitBrick(brick);
                break;
            }
        }
    }
    
    hitBrick(brick) {
        brick.hits--;
        
        if (brick.hits <= 0) {
            brick.visible = false;
            this.score += brick.points;
            this.createParticles(brick.x + brick.width/2, brick.y + brick.height/2, brick.color);
        }
        
        // 공 반사
        const ballCenterX = this.ball.x;
        const ballCenterY = this.ball.y;
        const brickCenterX = brick.x + brick.width / 2;
        const brickCenterY = brick.y + brick.height / 2;
        
        const deltaX = Math.abs(ballCenterX - brickCenterX);
        const deltaY = Math.abs(ballCenterY - brickCenterY);
        
        if (deltaX / brick.width > deltaY / brick.height) {
            this.ball.velocityX = -this.ball.velocityX;
        } else {
            this.ball.velocityY = -this.ball.velocityY;
        }
        
        this.updateBricksLeft();
    }
    
    createParticles(x, y, color) {
        for (let i = 0; i < 6; i++) {
            this.particles.push({
                x: x,
                y: y,
                velocityX: (Math.random() - 0.5) * 6,
                velocityY: (Math.random() - 0.5) * 6,
                life: 20,
                maxLife: 20,
                color: color,
                size: Math.random() * 3 + 2
            });
        }
    }
    
    updateParticles() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const particle = this.particles[i];
            particle.x += particle.velocityX;
            particle.y += particle.velocityY;
            particle.velocityY += 0.2;
            particle.life--;
            
            if (particle.life <= 0) {
                this.particles.splice(i, 1);
            }
        }
    }
    
    loseLife() {
        this.lives--;
        this.resetBall();
        
        if (this.lives <= 0) {
            this.gameOver();
        } else {
            this.waitingForLaunch = true;
            this.ball.attached = true;
        }
    }
    
    gameOver() {
        this.stopGame();
        
        if (this.score > this.bestScore) {
            this.bestScore = this.score;
            this.saveBestScore();
        }
        
        this.showGameResult('gameOver');
    }
    
    checkLevelComplete() {
        const visibleBricks = this.bricks.filter(brick => brick.visible);
        if (visibleBricks.length === 0) {
            this.levelComplete();
        }
    }
    
    levelComplete() {
        this.stopGame();
        
        // 보너스 점수
        this.score += this.lives * 100;
        
        if (this.score > this.bestScore) {
            this.bestScore = this.score;
            this.saveBestScore();
        }
        
        this.showGameResult('levelComplete');
    }
    
    nextLevel() {
        this.level++;
        this.lives = Math.min(this.lives + 1, 5);
        this.resetBall();
        this.resetPaddle();
        this.createBricks();
        this.particles = [];
        this.updateDisplay();
        document.getElementById('gameOverlay').classList.remove('active');
        this.startGame();
    }
    
    showGameResult(type) {
        const overlay = document.getElementById('gameOverlay');
        const icon = document.getElementById('overlayIcon');
        const title = document.getElementById('overlayTitle');
        const message = document.getElementById('overlayMessage');
        const nextLevelBtn = document.getElementById('nextLevelBtn');
        
        document.getElementById('finalScore').textContent = this.score;
        document.getElementById('finalLevel').textContent = this.level;
        
        if (type === 'levelComplete') {
            icon.className = 'fas fa-trophy';
            title.textContent = '레벨 클리어!';
            message.textContent = `레벨 ${this.level}을 완료했습니다! 보너스 점수 ${this.lives * 100}점을 획득했습니다.`;
            nextLevelBtn.style.display = 'flex';
        } else {
            icon.className = 'fas fa-skull-crossbones';
            title.textContent = '게임 오버';
            message.textContent = `레벨 ${this.level}에서 게임이 종료되었습니다.`;
            nextLevelBtn.style.display = 'none';
        }
        
        overlay.classList.add('active');
    }
    
    playAgain() {
        document.getElementById('gameOverlay').classList.remove('active');
        this.resetGame();
    }
    
    resetBall() {
        this.ball.x = this.canvas.width / 2;
        this.ball.y = this.canvas.height - 100;
        this.ball.velocityX = 0;
        this.ball.velocityY = 0;
        this.ball.attached = true;
    }
    
    resetPaddle() {
        this.paddle.x = this.canvas.width / 2 - this.paddle.width / 2;
    }
    
    draw() {
        // 캔버스 지우기
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 배경
        const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
        gradient.addColorStop(0, '#0a0a0a');
        gradient.addColorStop(1, '#1a1a1a');
        this.ctx.fillStyle = gradient;
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 벽돌 그리기
        this.bricks.forEach(brick => {
            if (brick.visible) {
                this.ctx.fillStyle = brick.color;
                this.ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                
                // 벽돌 테두리
                this.ctx.strokeStyle = '#333';
                this.ctx.lineWidth = 1;
                this.ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                
                // 다중 히트 표시
                if (brick.hits > 1) {
                    this.ctx.fillStyle = 'white';
                    this.ctx.font = '12px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(brick.hits.toString(), brick.x + brick.width/2, brick.y + brick.height/2 + 4);
                }
            }
        });
        
        // 패들 그리기
        this.ctx.fillStyle = '#01FF75';
        this.ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.width, this.paddle.height);
        
        // 패들 하이라이트
        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        this.ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.width, 4);
        
        // 공 그리기
        this.ctx.fillStyle = '#FFFFFF';
        this.ctx.beginPath();
        this.ctx.arc(this.ball.x, this.ball.y, this.ball.radius, 0, Math.PI * 2);
        this.ctx.fill();
        
        // 공 궤적
        if (!this.ball.attached && this.isPlaying && !this.isPaused) {
            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            this.ctx.beginPath();
            this.ctx.arc(this.ball.x - this.ball.velocityX, this.ball.y - this.ball.velocityY, this.ball.radius * 0.7, 0, Math.PI * 2);
            this.ctx.fill();
        }
        
        // 파티클 그리기
        this.particles.forEach(particle => {
            const alpha = particle.life / particle.maxLife;
            this.ctx.fillStyle = particle.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
            this.ctx.beginPath();
            this.ctx.arc(particle.x, particle.y, particle.size * alpha, 0, Math.PI * 2);
            this.ctx.fill();
        });
        
        // 발사 대기 화살표
        if (this.waitingForLaunch && this.ball.attached) {
            this.ctx.strokeStyle = '#01FF75';
            this.ctx.lineWidth = 2;
            this.ctx.setLineDash([5, 5]);
            this.ctx.beginPath();
            this.ctx.moveTo(this.ball.x, this.ball.y - 20);
            this.ctx.lineTo(this.ball.x, this.ball.y - 50);
            this.ctx.moveTo(this.ball.x - 5, this.ball.y - 45);
            this.ctx.lineTo(this.ball.x, this.ball.y - 50);
            this.ctx.lineTo(this.ball.x + 5, this.ball.y - 45);
            this.ctx.stroke();
            this.ctx.setLineDash([]);
        }
    }
    
    setDifficulty(difficulty) {
        this.difficulty = difficulty;
        
        document.querySelectorAll('[data-difficulty]').forEach(btn => {
            btn.classList.remove('active');
        });
        document.querySelector(`[data-difficulty="${difficulty}"]`).classList.add('active');
        
        switch(difficulty) {
            case 'easy':
                this.ball.speed = Math.max(3, this.ballSpeed - 1);
                this.paddle.width = 140;
                break;
            case 'normal':
                this.ball.speed = this.ballSpeed;
                this.paddle.width = 120;
                break;
            case 'hard':
                this.ball.speed = this.ballSpeed + 1;
                this.paddle.width = 100;
                break;
        }
    }
    
    setPaddleSize(size) {
        this.paddleSize = size;
        
        document.querySelectorAll('[data-paddle]').forEach(btn => {
            btn.classList.remove('active');
        });
        document.querySelector(`[data-paddle="${size}"]`).classList.add('active');
        
        switch(size) {
            case 'small':
                this.paddle.width = 80;
                break;
            case 'normal':
                this.paddle.width = 120;
                break;
            case 'large':
                this.paddle.width = 160;
                break;
        }
    }
    
    showSettings() {
        document.getElementById('settingsPanel').classList.add('active');
    }
    
    hideSettings() {
        document.getElementById('settingsPanel').classList.remove('active');
    }
    
    showGameStatus(type = 'ready') {
        const statusElement = document.getElementById('gameStatus');
        const statusContent = statusElement.querySelector('.status-content');
        
        let icon, title, message;
        
        if (type === 'paused') {
            icon = 'fas fa-pause-circle';
            title = '일시정지';
            message = '계속하기 버튼을 눌러 게임을 재개하세요.';
        } else {
            icon = 'fas fa-play-circle';
            title = '게임 준비';
            message = '시작 버튼을 눌러 게임을 시작하세요!';
        }
        
        statusContent.innerHTML = `
            <i class="${icon}"></i>
            <h3>${title}</h3>
            <p>${message}</p>
            <div class="controls-info">
                <span><i class="fas fa-mouse"></i> 마우스로 패들 조작</span>
                <span><i class="fas fa-mouse-pointer"></i> 클릭으로 공 발사</span>
            </div>
        `;
        
        statusElement.classList.add('active');
    }
    
    hideGameStatus() {
        document.getElementById('gameStatus').classList.remove('active');
    }
    
    showStartButton() {
        document.getElementById('startBtn').style.display = 'flex';
        document.getElementById('pauseBtn').style.display = 'none';
    }
    
    showPauseButton() {
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('pauseBtn').style.display = 'flex';
    }
    
    updateDisplay() {
        document.getElementById('scoreValue').textContent = this.score;
        document.getElementById('livesValue').textContent = this.lives;
        document.getElementById('levelValue').textContent = this.level;
        document.getElementById('bestScore').textContent = this.bestScore;
    }
    
    updateBricksLeft() {
        const visibleBricks = this.bricks.filter(brick => brick.visible).length;
        document.getElementById('bricksLeft').textContent = visibleBricks;
    }
    
    saveBestScore() {
        localStorage.setItem('breakoutBestScore', this.bestScore.toString());
    }
    
    loadBestScore() {
        const saved = localStorage.getItem('breakoutBestScore');
        this.bestScore = saved ? parseInt(saved) : 0;
    }
}

// 게임 초기화
document.addEventListener('DOMContentLoaded', () => {
    new BreakoutGame();
});
</script>
