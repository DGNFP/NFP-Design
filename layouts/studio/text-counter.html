{{ define "main" }}

<link rel="stylesheet" href="{{ "/css/studiopage.css" | relURL }}">

<section class="section">
<div class="container">
    <!-- 헤더 -->
    <div class="studio-page-header">
        <h1>Studio <span>NFP</span></h1>
        <span class="highlight">텍스트 카운터</span>
        <p><br>글자수, 용량, 읽기 시간을 실시간으로 확인할 수 있습니다.</p>
    </div>

<!-- 다른 페이지로 이동 버튼 -->
<div class="page-btn-wrapper">
<a href="{{ "/studio" | relURL }}" class="page-btn">스튜디오 메인</a>
<a href="{{ "/studio/web-demo" | relURL }}" class="page-btn">웹 데모</a>
<a href="{{ "/studio/text-counter" | relURL }}" class="page-btn">텍스트 카운터</a>
<a href="{{ "/studio/text-tools" | relURL }}" class="page-btn">더미 텍스트</a>
<a href="{{ "/studio/unit-converter" | relURL }}" class="page-btn">단위 변환기</a>
<a href="{{ "/studio/font-converter" | relURL }}" class="page-btn">폰트 변환기</a>
<a href="{{ "/#" | relURL }}" class="page-btn">#</a>
<a href="{{ "/#" | relURL }}" class="page-btn">#</a>
</div>

    <!-- 탭 컨텐츠 -->
    <div class="studio-page-content">
        <div class="container">
            <!-- 텍스트 입력 영역 -->
            <div class="text-counter-wrapper">
                <div class="text-counter-input-section">
                    <textarea 
                        id="textInput" 
                        class="text-counter-input"
                        placeholder="여기에 텍스트를 입력해보세요. 실시간으로 글자수를 세어드립니다!"
                        rows="12"
                    ></textarea>
                    
                    <div class="text-counter-actions">
                        <button onclick="clearText()" class="text-counter-clear-btn">전체 삭제</button>
                        <button onclick="pasteText()" class="text-counter-paste-btn">붙여넣기</button>
                    </div>
                </div>

                <!-- 카운트 결과 영역 -->
                <div class="text-counter-results">
                    <h3>카운트 결과</h3>
                    
                    <div class="text-counter-grid">
                        <div class="text-counter-item">
                            <span class="text-counter-label">전체 글자수</span>
                            <span class="text-counter-value" id="totalChars">0</span>
                        </div>
                        
                        <div class="text-counter-item">
                            <span class="text-counter-label">공백 제외 글자수</span>
                            <span class="text-counter-value" id="charsNoSpace">0</span>
                        </div>
                        
                        <div class="text-counter-item">
                            <span class="text-counter-label">바이트 수</span>
                            <span class="text-counter-value" id="byteCount">0</span>
                        </div>
                    </div>

                    <!-- 추가 정보 -->
                    <div class="text-counter-additional-info">
                        <h4>추가 정보</h4>
                        <div class="text-counter-info-grid">
                            <div class="text-counter-info-item">
                                <span class="text-counter-info-label">평균 단어 길이:</span>
                                <span class="text-counter-info-value" id="avgWordLength">0</span>
                            </div>
                            <div class="text-counter-info-item">
                                <span class="text-counter-info-label">읽기 예상 시간:</span>
                                <span class="text-counter-info-value" id="readingTime">0분</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</section>


<script>
function updateCounters() {
    const text = document.getElementById('textInput').value;
    
    // 기본 카운트
    const totalChars = text.length;
    const charsNoSpace = text.replace(/\s/g, '').length;
    const bytes = new TextEncoder().encode(text).length;
    
    // 단어 수 계산 (평균 단어 길이용)
    const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    
    // 평균 단어 길이 계산
    const avgWordLength = words > 0 ? Math.round((charsNoSpace / words) * 10) / 10 : 0;
    
    // 읽기 시간 계산 (분당 200단어 기준)
    const readingTime = words > 0 ? Math.max(1, Math.ceil(words / 200)) : 0;
    
    // 값 업데이트
    document.getElementById('totalChars').textContent = totalChars.toLocaleString();
    document.getElementById('charsNoSpace').textContent = charsNoSpace.toLocaleString();
    document.getElementById('byteCount').textContent = bytes.toLocaleString();
    document.getElementById('avgWordLength').textContent = avgWordLength + '글자';
    document.getElementById('readingTime').textContent = readingTime + '분';
}

function clearText() {
    document.getElementById('textInput').value = '';
    updateCounters();
    document.getElementById('textInput').focus();
}

async function copyText() {
    const textInput = document.getElementById('textInput');
    try {
        await navigator.clipboard.writeText(textInput.value);
        
        // 버튼 피드백
        const btn = event.target;
        const originalText = btn.textContent;
        btn.textContent = '복사됨!';
        btn.style.backgroundColor = '#059669';
        
        setTimeout(() => {
            btn.textContent = originalText;
            btn.style.backgroundColor = '#10b981';
        }, 1500);
    } catch (err) {
        console.error('복사 실패:', err);
        alert('복사에 실패했습니다.');
    }
}

async function pasteText() {
    try {
        const text = await navigator.clipboard.readText();
        document.getElementById('textInput').value = text;
        updateCounters();
    } catch (err) {
        console.error('붙여넣기 실패:', err);
        alert('붙여넣기에 실패했습니다.');
    }
}

// 실시간 업데이트
document.getElementById('textInput').addEventListener('input', updateCounters);
document.getElementById('textInput').addEventListener('paste', () => {
    setTimeout(updateCounters, 10);
});

// 초기 로드시 카운터 업데이트
document.addEventListener('DOMContentLoaded', updateCounters);
</script>

{{ end }}
