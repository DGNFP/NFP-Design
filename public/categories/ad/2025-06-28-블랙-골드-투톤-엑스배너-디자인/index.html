<script type="module">

function waitForFirebase() {
    return new Promise((resolve) => {
        const checkFirebase = () => {
            if (window.firebaseDB && window.firestoreUtils) {
                resolve();
            } else {
                setTimeout(checkFirebase, 100);
            }
        };
        checkFirebase();
    });
}


const postId = decodeURIComponent(window.location.pathname)
    .replace(/\//g, '-')
    .replace(/^-|-$/g, '')
    .replace(/--+/g, '-');


async function updateViews() {
    try {
        await waitForFirebase();
        
        const { doc, getDoc, setDoc, updateDoc, increment } = window.firestoreUtils;
        const db = window.firebaseDB;
        
        
        const docRef = doc(db, "post_views", postId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            await updateDoc(docRef, {
                count: increment(1)
            });
        } else {
            await setDoc(docRef, {
                count: 1
            });
        }

        
        const updatedDoc = await getDoc(docRef);
        if (updatedDoc.exists()) {
            const count = updatedDoc.data().count;
            document.getElementById('view-count').textContent = count;
        }

    } catch (error) {
        document.getElementById('view-count').textContent = '0';
    }
}


document.addEventListener('DOMContentLoaded', updateViews);
</script>
