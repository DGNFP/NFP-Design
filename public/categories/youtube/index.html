<script>
document.addEventListener('DOMContentLoaded', function() {
    const filterButtons = document.querySelectorAll('.youtube-category-filter a');
    const videoItems = document.querySelectorAll('.youtube-item');
    const searchInput = document.getElementById('youtubeSearchInput');
    const searchBtn = document.getElementById('youtubeSearchBtn');
    
    
    filterButtons.forEach(button => {
        button.addEventListener('click', function(e) {
            e.preventDefault();
            
            filterButtons.forEach(btn => btn.classList.remove('active'));
            this.classList.add('active');
            
            const filter = this.dataset.filter;
            
            videoItems.forEach(item => {
                const category = item.dataset.category;
                let shouldShow = false;
                
                if (filter === 'all') {
                    shouldShow = true;
                } else {
                    shouldShow = category === filter;
                }
                
                item.style.display = shouldShow ? 'block' : 'none';
            });
        });
    });
    
    
    function searchVideos() {
        const query = searchInput.value.toLowerCase();
        
        videoItems.forEach(item => {
            const title = item.dataset.title || '';
            const shouldShow = title.includes(query);
            item.style.display = shouldShow ? 'block' : 'none';
        });
        
        
        filterButtons.forEach(btn => btn.classList.remove('active'));
    }
    
    if (searchBtn) {
        searchBtn.addEventListener('click', searchVideos);
    }
    
    if (searchInput) {
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchVideos();
            }
        });
        
        
        searchInput.addEventListener('input', function() {
            if (this.value === '') {
                videoItems.forEach(item => {
                    item.style.display = 'block';
                });
                
                filterButtons.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.filter === 'all') {
                        btn.classList.add('active');
                    }
                });
            }
        });
    }
});
</script>
