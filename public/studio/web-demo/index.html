<script>

document.querySelectorAll('.demo-editor-tab').forEach(tab => {
    tab.addEventListener('click', function() {
        const editorType = this.dataset.editor;
        
        
        document.querySelectorAll('.demo-editor-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        
        
        document.getElementById('html-editor').style.display = editorType === 'html' ? 'block' : 'none';
        document.getElementById('css-editor').style.display = editorType === 'css' ? 'block' : 'none';
    });
});


function updatePreview() {
    const htmlCode = document.getElementById('html-editor').value;
    const cssCode = document.getElementById('css-editor').value;
    const iframe = document.getElementById('preview-frame');
    
    
    let fullCode = htmlCode;
    
    
    if (fullCode.includes('<head>')) {
        fullCode = fullCode.replace('</head>', `<style>${cssCode}</style>\n</head>`);
    } else if (fullCode.includes('<body>')) {
        fullCode = fullCode.replace('<body>', `<head><style>${cssCode}</style></head>\n<body>`);
    } else {
        
        fullCode = `<!DOCTYPE html>
<html>
<head><style>${cssCode}</style></head>
<body>
${fullCode}
</body>
</html>`;
    }
    
    
    iframe.srcdoc = fullCode;
}


document.getElementById('html-editor').addEventListener('input', updatePreview);
document.getElementById('css-editor').addEventListener('input', updatePreview);


function refreshPreview() {
    updatePreview();
}


function openInNewTab() {
    const htmlCode = document.getElementById('html-editor').value;
    const cssCode = document.getElementById('css-editor').value;
    
    let fullCode = htmlCode;
    
    if (fullCode.includes('<head>')) {
        fullCode = fullCode.replace('</head>', `<style>${cssCode}</style>\n</head>`);
    } else if (fullCode.includes('<body>')) {
        fullCode = fullCode.replace('<body>', `<head><style>${cssCode}</style></head>\n<body>`);
    } else {
        fullCode = `<!DOCTYPE html>
<html>
<head><style>${cssCode}</style></head>
<body>
${fullCode}
</body>
</html>`;
    }
    
    const blob = new Blob([fullCode], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    
    
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadCode() {
    const htmlCode = document.getElementById('html-editor').value;
    const cssCode = document.getElementById('css-editor').value;
    
    let fullCode = htmlCode;
    
    if (fullCode.includes('<head>')) {
        fullCode = fullCode.replace('</head>', `<style>${cssCode}</style>\n</head>`);
    } else if (fullCode.includes('<body>')) {
        fullCode = fullCode.replace('<body>', `<head><style>${cssCode}</style></head>\n<body>`);
    } else {
        fullCode = `<!DOCTYPE html>
<html>

<body>
${fullCode}
</body>
</html>`;
    }
    
    const blob = new Blob([fullCode], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = 'web-demo.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    URL.revokeObjectURL(url);
}
