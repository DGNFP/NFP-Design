<script>
document.addEventListener('DOMContentLoaded', function () {
  
  if (window.createCardCounterDisplay) {
    const { gradientCard } = window.createCardCounterDisplay();
    const mount = document.getElementById('counter-mount');
    if (mount) mount.innerHTML = gradientCard;
  }

  
  if (window.initializeCardCounter) {
    window.initializeCardCounter();
  }

  
  function readGradientMeta() {
    const el = document.getElementById('gradient-card-element');
    if (!el || !el.dataset) return null;

    const meta = {};
    const raw = el.dataset;

    if (raw.isSpecial !== undefined) {
      meta.isSpecial = (raw.isSpecial === 'true' || raw.isSpecial === 'special');
    }
    if (raw.specialType) meta.specialType = raw.specialType; 
    if (raw.isDarkSpecial !== undefined) {
      meta.isDarkSpecial = (raw.isDarkSpecial === 'true' || raw.isDarkSpecial === 'dark');
    }

    return Object.keys(meta).length ? meta : null;
  }

  
  function countGradientDraw() {
    if (window.onCardDrawn) {
      window.onCardDrawn('gradient', readGradientMeta());
    }
  }

  const pickBtn = document.getElementById('gradient-pick-btn');
  const newBtn  = document.getElementById('gradient-new-btn');

  if (pickBtn) pickBtn.addEventListener('click', () => {
    
    setTimeout(countGradientDraw, 0);
  });
  if (newBtn) newBtn.addEventListener('click', () => {
    setTimeout(countGradientDraw, 0);
  });

  
  
  window.addEventListener('gradient-card-drawn', (e) => {
    if (window.onCardDrawn) window.onCardDrawn('gradient', e.detail || null);
  });
});
</script>
