<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

<script>

function generateBasicQR() {
    const input = document.getElementById('studio-qr-input');
    const size = document.getElementById('studio-qr-size');
    const canvas = document.getElementById('studio-qr-canvas');
    const placeholder = document.getElementById('qr-placeholder');
    const button = document.getElementById('qr-generate-btn');
    const downloadBtn = document.getElementById('studio-download-btn');
    
    if (!input || !size || !canvas) return;
    
    const inputValue = input.value.trim();
    const sizeValue = parseInt(size.value);
    
    if (!inputValue) {
        alert('변환할 내용을 입력해주세요.');
        return;
    }
    
    
    button.disabled = true;
    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 생성 중...';
    
    try {
        
        const qr = new QRious({
            element: canvas,
            value: inputValue,
            size: sizeValue,
            foreground: '#000000',
            background: '#FFFFFF',
            level: 'M' 
        });
        
        
        placeholder.style.display = 'none';
        canvas.style.display = 'block';
        downloadBtn.style.display = 'inline-block';
        
        
        showBasicQRSuccessToast();
        
    } catch (error) {
        console.error('QR 코드 생성 오류:', error);
        alert('QR 코드 생성 중 오류가 발생했습니다. 입력한 내용을 확인해주세요.');
    } finally {
        
        button.disabled = false;
        button.innerHTML = '<i class="fas fa-qrcode"></i> QR 코드 생성';
    }
}


function downloadBasicQR() {
    const canvas = document.getElementById('studio-qr-canvas');
    if (!canvas) return;
    
    try {
        const link = document.createElement('a');
        link.download = `Studio-NFP_qrcode_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        
        showBasicDownloadSuccessToast();
        
    } catch (error) {
        console.error('다운로드 오류:', error);
        alert('다운로드 중 오류가 발생했습니다.');
    }
}


function showBasicQRSuccessToast() {
    const existingToast = document.querySelector('.basic-qr-success-toast');
    if (existingToast) {
        existingToast.remove();
    }
    
    const toast = document.createElement('div');
    toast.className = 'basic-qr-success-toast';
    toast.innerHTML = '<i class="fas fa-check"></i> QR 코드가 생성되었습니다!';
    toast.style.cssText = `
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #01FF75, #00CC5E);
        color: black;
        padding: 12px 24px;
        border-radius: 25px;
        font-weight: 600;
        z-index: 10000;
        animation: basicQrToastShow 0.3s ease;
    `;
    
    if (!document.querySelector('#basic-qr-toast-style')) {
        const style = document.createElement('style');
        style.id = 'basic-qr-toast-style';
        style.textContent = `
            @keyframes basicQrToastShow {
                from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
                to { opacity: 1; transform: translateX(-50%) translateY(0); }
            }
        `;
        document.head.appendChild(style);
    }
    
    document.body.appendChild(toast);
    
    setTimeout(() => {
        if (toast.parentNode) {
            toast.style.animation = 'basicQrToastShow 0.3s ease reverse';
            setTimeout(() => toast.remove(), 300);
        }
    }, 2000);
}


function showBasicDownloadSuccessToast() {
    const existingToast = document.querySelector('.basic-download-success-toast');
    if (existingToast) {
        existingToast.remove();
    }
    
    const toast = document.createElement('div');
    toast.className = 'basic-download-success-toast';
    toast.innerHTML = '<i class="fas fa-download"></i> 다운로드 완료!';
    toast.style.cssText = `
        position: fixed;
        top: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #01FF75, #00CC5E);
        color: black;
        padding: 12px 24px;
        border-radius: 25px;
        font-weight: 600;
        z-index: 10000;
        animation: basicDownloadToastShow 0.3s ease;
    `;
    
    if (!document.querySelector('#basic-download-toast-style')) {
        const style = document.createElement('style');
        style.id = 'basic-download-toast-style';
        style.textContent = `
            @keyframes basicDownloadToastShow {
                from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
                to { opacity: 1; transform: translateX(-50%) translateY(0); }
            }
        `;
        document.head.appendChild(style);
    }
    
    document.body.appendChild(toast);
    
    setTimeout(() => {
        if (toast.parentNode) {
            toast.style.animation = 'basicDownloadToastShow 0.3s ease reverse';
            setTimeout(() => toast.remove(), 300);
        }
    }, 2000);
}


document.addEventListener('DOMContentLoaded', function() {
    const generateBtn = document.getElementById('qr-generate-btn');
    const downloadBtn = document.getElementById('studio-download-btn');
    const input = document.getElementById('studio-qr-input');
    
    if (generateBtn) {
        generateBtn.addEventListener('click', generateBasicQR);
    }
    
    if (downloadBtn) {
        downloadBtn.addEventListener('click', downloadBasicQR);
    }
    
    
    if (input) {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateBasicQR();
            }
        });
    }
});
</script>
