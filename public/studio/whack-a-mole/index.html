}

.hole {
    aspect-ratio: 1;
    background: #2a2a2a;
    border: 2px solid var(--sub-border-color);
    border-radius: 50%;
    position: relative;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.3s ease;
}

.hole:hover {
    border-color: var(--accent-color);
    transform: scale(1.05);
}

.hole.active {
    border-color: var(--accent-color);
    box-shadow: 0 0 20px rgba(1, 255, 117, 0.3);
}

.mole {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: var(--accent-color);
    width: 80%;
    height: 80%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    cursor: pointer;
}

.mole i {
    font-size: 24px;
    color: black;
    transition: all 0.1s ease;
}

.mole.show {
    transform: translate(-50%, -50%) scale(1);
}

.mole.hit {
    background: #ff4757;
    transform: translate(-50%, -50%) scale(1.2);
}

.mole.hit i {
    transform: rotate(45deg);
}

    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
}

    display: flex;

    transition: all 0.3s ease;

}

<script>
class WhackAMoleGame {
    constructor() {
        this.score = 0;
        this.timeLeft = 30;
        this.combo = 0;
        this.maxCombo = 0;
        this.isPlaying = false;
        this.isPaused = false;
        this.gameTimer = null;
        this.moleTimer = null;
        this.activeMoles = new Set();
        this.totalClicks = 0;
        this.successfulHits = 0;
        this.bestScore = 0;
        
        this.difficulty = 'normal';
        this.difficulties = {
            easy: { moleSpeed: 2000, moleLife: 1500, pointMultiplier: 1 },
            normal: { moleSpeed: 1500, moleLife: 1200, pointMultiplier: 1.2 },
            hard: { moleSpeed: 1000, moleLife: 900, pointMultiplier: 1.5 },
            expert: { moleSpeed: 700, moleLife: 600, pointMultiplier: 2 }
        };
        
        this.init();
    }
    
    init() {
        this.loadBestScore();
        this.setupEventListeners();
        this.updateDisplay();
        this.showGameStatus('ready');
    }
    
    setupEventListeners() {
        
        document.getElementById('startBtn').addEventListener('click', () => this.startGame());
        document.getElementById('pauseBtn').addEventListener('click', () => this.togglePause());
        document.getElementById('resetBtn').addEventListener('click', () => this.resetGame());
        document.getElementById('difficultyBtn').addEventListener('click', () => this.showDifficultyPanel());
        
        
        document.getElementById('closeDifficulty').addEventListener('click', () => this.hideDifficultyPanel());
        document.querySelectorAll('.difficulty-option').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const difficulty = btn.dataset.difficulty;
                this.setDifficulty(difficulty);
            });
        });
        
        
        document.querySelectorAll('.hole').forEach(hole => {
            hole.addEventListener('click', (e) => {
                if (this.isPlaying && !this.isPaused) {
                    this.hitHole(parseInt(hole.dataset.hole));
                }
            });
        });
        
        
        document.getElementById('playAgainBtn').addEventListener('click', () => this.playAgain());
    }
    
    startGame() {
        this.score = 0;
        this.timeLeft = 30;
        this.combo = 0;
        this.maxCombo = 0;
        this.totalClicks = 0;
        this.successfulHits = 0;
        this.isPlaying = true;
        this.isPaused = false;
        this.activeMoles.clear();
        
        this.updateDisplay();
        this.hideGameStatus();
        this.showPauseButton();
        this.startTimer();
        this.startMoleSpawning();
    }
    
    togglePause() {
        this.isPaused = !this.isPaused;
        
        if (this.isPaused) {
            this.showGameStatus('paused');
            document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-play"></i><span>계속하기</span>';
        } else {
            this.hideGameStatus();
            document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-pause"></i><span>일시정지</span>';
        }
    }
    
    resetGame() {
        this.stopGame();
        this.score = 0;
        this.timeLeft = 30;
        this.combo = 0;
        this.maxCombo = 0;
        this.totalClicks = 0;
        this.successfulHits = 0;
        this.updateDisplay();
        this.hideAllMoles();
        this.showGameStatus('ready');
        this.showStartButton();
    }
    
    stopGame() {
        this.isPlaying = false;
        this.isPaused = false;
        if (this.gameTimer) clearInterval(this.gameTimer);
        if (this.moleTimer) clearTimeout(this.moleTimer);
        this.hideAllMoles();
        this.showStartButton();
    }
    
    startTimer() {
        this.gameTimer = setInterval(() => {
            if (!this.isPaused) {
                this.timeLeft--;
                this.updateDisplay();
                
                if (this.timeLeft <= 0) {
                    this.endGame();
                }
            }
        }, 1000);
    }
    
    startMoleSpawning() {
        if (!this.isPlaying) return;
        
        const config = this.difficulties[this.difficulty];
        const randomDelay = Math.random() * config.moleSpeed + 300;
        
        this.moleTimer = setTimeout(() => {
            if (this.isPlaying && !this.isPaused) {
                this.spawnMole();
                this.startMoleSpawning();
            }
        }, randomDelay);
    }
    
    spawnMole() {
        const availableHoles = [];
        for (let i = 0; i < 9; i++) {
            if (!this.activeMoles.has(i)) {
                availableHoles.push(i);
            }
        }
        
        if (availableHoles.length === 0) return;
        
        const holeIndex = availableHoles[Math.floor(Math.random() * availableHoles.length)];
        const hole = document.querySelector(`[data-hole="${holeIndex}"]`);
        const mole = hole.querySelector('.mole');
        
        this.activeMoles.add(holeIndex);
        hole.classList.add('active');
        mole.classList.add('show');
        
        const config = this.difficulties[this.difficulty];
        setTimeout(() => {
            if (this.activeMoles.has(holeIndex)) {
                this.hideMole(holeIndex);
            }
        }, config.moleLife);
    }
    
    hitHole(holeIndex) {
        this.totalClicks++;
        
        if (this.activeMoles.has(holeIndex)) {
            this.hitMole(holeIndex);
        } else {
            this.missHit();
        }
    }
    
    hitMole(holeIndex) {
        const hole = document.querySelector(`[data-hole="${holeIndex}"]`);
        const mole = hole.querySelector('.mole');
        
        this.successfulHits++;
        this.combo++;
        this.maxCombo = Math.max(this.maxCombo, this.combo);
        
        const config = this.difficulties[this.difficulty];
        const points = Math.floor(10 * config.pointMultiplier * (1 + this.combo * 0.1));
        this.score += points;
        
        
        mole.classList.add('hit');
        setTimeout(() => {
            this.hideMole(holeIndex);
        }, 200);
        
        this.updateDisplay();
    }
    
    missHit() {
        this.combo = 0;
        this.updateDisplay();
    }
    
    hideMole(holeIndex) {
        const hole = document.querySelector(`[data-hole="${holeIndex}"]`);
        const mole = hole.querySelector('.mole');
        
        this.activeMoles.delete(holeIndex);
        hole.classList.remove('active');
        mole.classList.remove('show', 'hit');
    }
    
    hideAllMoles() {
        for (let i = 0; i < 9; i++) {
            this.hideMole(i);
        }
        this.activeMoles.clear();
    }
    
    endGame() {
        this.stopGame();
        
        if (this.score > this.bestScore) {
            this.bestScore = this.score;
            this.saveBestScore();
        }
        
        this.showResult();
    }
    
    showResult() {
        const accuracy = this.totalClicks > 0 ? Math.round((this.successfulHits / this.totalClicks) * 100) : 0;
        
        document.getElementById('finalScore').textContent = this.score;
        document.getElementById('moleCaught').textContent = this.successfulHits;
        document.getElementById('accuracy').textContent = accuracy + '%';
        document.getElementById('maxCombo').textContent = this.maxCombo;
        
        let message = '좋은 게임이었습니다!';
        if (this.score >= 1000) message = '놀라운 점수입니다! 두더지 잡기 마스터!';
        else if (this.score >= 500) message = '훌륭합니다! 빠른 반응속도를 보여주셨네요!';
        else if (this.score >= 200) message = '좋은 점수입니다! 계속 연습하면 더 좋아질 거예요!';
        
        document.getElementById('resultMessage').textContent = message;
        document.getElementById('resultPanel').classList.add('active');
    }
    
    playAgain() {
        document.getElementById('resultPanel').classList.remove('active');
        this.resetGame();
    }
    
    setDifficulty(difficulty) {
        this.difficulty = difficulty;
        
        
        document.querySelectorAll('.difficulty-option').forEach(btn => {
            btn.classList.remove('active');
        });
        document.querySelector(`[data-difficulty="${difficulty}"]`).classList.add('active');
        
        
        const difficultyNames = {
            easy: '쉬움',
            normal: '보통', 
            hard: '어려움',
            expert: '전문가'
        };
        document.getElementById('difficultyText').textContent = difficultyNames[difficulty];
        
        this.hideDifficultyPanel();
    }
    
    showDifficultyPanel() {
        document.getElementById('difficultyPanel').classList.add('active');
    }
    
    hideDifficultyPanel() {
        document.getElementById('difficultyPanel').classList.remove('active');
    }
    
    showGameStatus(type) {
        const statusElement = document.getElementById('gameStatus');
        const statusDisplay = statusElement.querySelector('.status-display');
        
        let icon, title, message;
        
        switch(type) {
            case 'ready':
                icon = 'fas fa-play-circle';
                title = '게임 준비중';
                message = '하단의 시작 버튼을 눌러 게임을 시작하세요!';
                break;
            case 'paused':
                icon = 'fas fa-pause-circle';
                title = '일시정지';
                message = '계속하기 버튼을 눌러 게임을 재개하세요.';
                break;
        }
        
        statusDisplay.innerHTML = `
            <i class="${icon}"></i>
            <h3>${title}</h3>
            <p>${message}</p>
        `;
        
        statusElement.classList.add('active');
    }
    
    hideGameStatus() {
        document.getElementById('gameStatus').classList.remove('active');
    }
    
    showStartButton() {
        document.getElementById('startBtn').style.display = 'flex';
        document.getElementById('pauseBtn').style.display = 'none';
    }
    
    showPauseButton() {
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('pauseBtn').style.display = 'flex';
    }
    
    updateDisplay() {
        document.getElementById('scoreValue').textContent = this.score;
        document.getElementById('timeValue').textContent = this.timeLeft;
        document.getElementById('comboValue').textContent = this.combo;
        document.getElementById('bestScore').textContent = this.bestScore;
    }
    
    saveBestScore() {
        localStorage.setItem('whackMoleBestScore', this.bestScore.toString());
    }
    
    loadBestScore() {
        const saved = localStorage.getItem('whackMoleBestScore');
        this.bestScore = saved ? parseInt(saved) : 0;
    }
}


document.addEventListener('DOMContentLoaded', () => {
    new WhackAMoleGame();
});
</script>
