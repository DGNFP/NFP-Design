baseURL: "https://nfpdesign.co.kr"
languageCode: 'ko'
title: 'NFP 디자인 - 디테일에서 시작해 트렌드를 완성하다.'
buildFuture: true
buildExpired: true
cleanDestinationDir: true
timezone: "Asia/Seoul"

# 🎯 SEO 관련 설정 추가
enableRobotsTXT: true

# 🎯 사이트맵 설정 추가
sitemap:
  changefreq: "daily"
  priority: 0.8
  filename: "sitemap.xml"

googleAnalyticsID: "G-HG6N24RD49"
images:
  - "img/nfp-main.png"

params:
  description: "고객의 Needs를 읽는 섬세한 시선, 트렌드를 이끄는 Fresh한 감각, 디테일을 살린 Pop한 디자인"
  author: "NFP Design"
  timezone: "Asia/Seoul"
  youtube_channel_handle: "Studio-NFP"  

menu: 
  main:
    - name: "홈"
      url: "/#home"
      weight: 1
    - name: "프로젝트"
      url: "/#design"
      weight: 2
    - name: "연락하기"
      url: "/#contact"
      weight: 3
    - name: "작업 보기"
      url: "/categories/"
      weight: 4
    - name: "블로그"
      url: "/games/"
      weight: 5
    - name: "Studio NFP"
      url: "/studio/"
      weight: 6

# CSS MIME 타입 설정 추가 (CSS 오류 해결)
mediaTypes:
  text/css:
    suffixes: ["css"]

outputFormats:
  CSS:
    mediaType: "text/css"
    isPlainText: false

taxonomies:
  category: "categories"
  tag: "tags"



markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      autoHeadingID: true
      wrapStandAloneImageWithinParagraph: false  # 🔥 이 설정이 핵심!
