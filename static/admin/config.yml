backend:
  name: git-gateway
  branch: main

# SEO 관련 설정 추가
enableRobotsTXT: true

sitemap:
  changefreq: "weekly"
  filename: "sitemap.xml"
  priority: 0.5  

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

locale: 'ko'

collections:
  - name: "web-posts"
    label: "웹 작업물"
    folder: "content/categories/web"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "제목", name: "title", widget: "string"}
      - {label: "소제목", name: "subtitle", widget: "string", required: false}
      - {label: "발행일", name: "date", widget: "datetime"}
      - {label: "카테고리", name: "categories", widget: "hidden", default: ["web"]}
      - {label: "서브 카테고리", name: "subCategory", widget: "select", options: ["홈페이지 디자인", "디지털배너 디자인", "상세페이지 디자인", "UX/UI 디자인"], required: false}
      - {label: "태그", name: "tags", widget: "select", multiple: true, options: ["NFP 디자인", "NFP Design","스튜디오 NFP","Studio NFP", "홈페이지 디자인", "디지털 배너 디자인", "상세페이지 디자인", "UX/UI 디자인", "XD", "Photoshop", "Illustrator", "HTML5", "CSS3", "JavaScript", "Figma"], hint: "프로젝트와 관련된 스킬이나 작업 유형을 선택하세요", required: false}
      - label: "커스텀 태그"
        name: "custom_tags"
        widget: "list"
        allow_add: true
        field: {label: "태그", name: "tag", widget: "string"}
        hint: "새로운 태그를 직접 입력하세요"
        required: false
      - {label: "내용", name: "body", widget: "markdown", editor_components: ["image"], hint: "본문에서도 이미지 업로드가 가능합니다. 위의 이미지 필드와 본문 이미지를 함께 활용하세요."}

  - name: "ad-posts"
    label: "광고 작업물"
    folder: "content/categories/ad"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "제목", name: "title", widget: "string"}
      - {label: "소제목", name: "subtitle", widget: "string", required: false}
      - {label: "발행일", name: "date", widget: "datetime"}
      - {label: "카테고리", name: "categories", widget: "hidden", default: ["ad"]}
      - {label: "서브 카테고리", name: "subCategory", widget: "select", options: ["현수막/엑스배너 디자인", "명함 디자인", "브로슈어/카탈로그 디자인", "홍보물 디자인", "패키지 디자인"], required: false}
      - {label: "태그", name: "tags", widget: "select", multiple: true, options: ["NFP 디자인", "NFP Design", "스튜디오 NFP","Studio NFP","현수막/엑스배너 디자인", "명함 디자인", "브로슈어/카탈로그 디자인", "홍보물 디자인", "패키지 디자인", "XD", "Photoshop", "Illustrator", "InDesign"], hint: "프로젝트와 관련된 스킬이나 작업 유형을 선택하세요", required: false}
      - label: "커스텀 태그"
        name: "custom_tags"
        widget: "list"
        allow_add: true
        field: {label: "태그", name: "tag", widget: "string"}
        hint: "새로운 태그를 직접 입력하세요"
        required: false
      - {label: "내용", name: "body", widget: "markdown", editor_components: ["image"], hint: "본문에서도 이미지 업로드가 가능합니다. 위의 이미지 필드와 본문 이미지를 함께 활용하세요."}

